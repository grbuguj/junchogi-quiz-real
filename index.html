
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>정보처리기사 실기 이론 기출퀴즈</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Noto Sans KR',sans-serif;background:#f7f8fa;color:#222;line-height:1.6}
.wrap{max-width:640px;margin:0 auto;padding:16px}
.badge{display:inline-block;padding:4px 12px;border-radius:20px;font-size:12px;font-weight:700;background:#e8f5e9;color:#2e7d32;margin-bottom:10px}
h1{font-size:22px;font-weight:800;margin-bottom:2px}
.subtitle{font-size:13px;color:#888;margin-bottom:20px}
.score-panel{display:flex;justify-content:center;gap:0;margin-bottom:18px;background:#fff;border-radius:14px;border:1px solid #eee;overflow:hidden}
.score-item{flex:1;text-align:center;padding:14px 8px}
.score-item:not(:last-child){border-right:1px solid #f0f0f0}
.score-num{font-size:22px;font-weight:800}
.score-label{font-size:11px;color:#999;margin-top:2px}
.score-num.green{color:#4caf50}
.score-num.red{color:#f44336}
.score-num.gray{color:#bbb}
.progress-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-size:13px;color:#666;font-weight:600}
.progress-bar{width:100%;height:4px;background:#e0e0e0;border-radius:2px;margin-bottom:16px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,#5c6bc0,#7c4dff);border-radius:2px;transition:width .3s}
.tab-row{display:flex;background:#fff;border-radius:12px;border:1px solid #eee;overflow:hidden;margin-bottom:16px}
.tab-btn{flex:1;padding:10px;text-align:center;font-size:14px;font-weight:600;color:#999;cursor:pointer;border:none;background:none;transition:all .15s}
.tab-btn.active{background:#222;color:#fff;border-radius:10px;margin:3px}
.q-card{background:#fff;border-radius:16px;border:1px solid #eee;padding:20px;margin-bottom:14px}
.q-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.q-id{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:20px;background:#f5f5f5;font-size:13px;font-weight:700;color:#555}
.q-source{font-size:12px;color:#aaa;font-weight:600}
.q-status{font-size:12px;font-weight:600;padding:3px 10px;border-radius:12px}
.q-status.none{color:#bbb;background:#f8f8f8}
.q-status.correct{color:#4caf50;background:#e8f5e9}
.q-status.wrong{color:#f44336;background:#fce4ec}
.q-status.skip{color:#ff9800;background:#fff3e0}
.q-text{font-size:15px;line-height:1.8;color:#333;margin-bottom:16px;word-break:keep-all}
.hint-btn{display:inline-flex;align-items:center;gap:4px;padding:6px 14px;border-radius:20px;border:1px solid #e0e0e0;background:#fafafa;color:#888;font-size:13px;font-weight:500;cursor:pointer;margin-bottom:14px;transition:all .15s}
.hint-btn:hover{background:#f0f0f0}
.hint-box{display:none;padding:10px 14px;border-radius:10px;background:#fffde7;border:1px solid #fff9c4;font-size:13px;color:#f9a825;margin-bottom:14px;font-weight:600}
.hint-box.show{display:block}
.input-row{display:flex;gap:8px}
.answer-input{flex:1;padding:12px 16px;border:2px solid #e0e0e0;border-radius:12px;font-size:15px;font-family:inherit;outline:none;transition:border .2s}
.answer-input:focus{border-color:#7c4dff}
.answer-input.correct-border{border-color:#4caf50;background:#f0fff0}
.answer-input.wrong-border{border-color:#f44336;background:#fff5f5}
.submit-btn{padding:12px 24px;border:none;border-radius:12px;background:#7c4dff;color:#fff;font-size:15px;font-weight:700;cursor:pointer;transition:all .15s;white-space:nowrap}
.submit-btn:hover{background:#651fff}
.submit-btn:disabled{background:#ccc;cursor:default}
.result-box{display:none;margin-top:12px;padding:14px;border-radius:12px;font-size:14px;line-height:1.7}
.result-box.show{display:block}
.result-box.correct{background:#e8f5e9;border:1px solid #a5d6a7;color:#2e7d32}
.result-box.wrong{background:#fce4ec;border:1px solid #ef9a9a;color:#c62828}
.result-answer{font-weight:700;font-size:15px;margin-top:4px}
.nav-row{display:flex;gap:8px;margin-top:16px}
.nav-btn{flex:1;padding:12px;border:1px solid #e0e0e0;border-radius:12px;background:#fff;font-size:14px;font-weight:600;color:#555;cursor:pointer;text-align:center;transition:all .15s}
.nav-btn:hover{background:#f5f5f5}
.nav-btn.skip-btn{flex:0 0 auto;padding:12px 20px}
.shortcut-bar{display:flex;gap:16px;justify-content:center;padding:12px;margin-top:12px;font-size:12px;color:#bbb}
.shortcut-bar kbd{display:inline-block;padding:2px 8px;border-radius:4px;background:#f0f0f0;color:#666;font-weight:600;font-size:11px;border:1px solid #ddd}
.bottom-row{display:flex;justify-content:space-between;align-items:center;margin-top:16px;padding-top:12px;border-top:1px solid #eee}
.reset-btn{padding:8px 16px;border:1px solid #e0e0e0;border-radius:8px;background:#fff;font-size:13px;color:#888;cursor:pointer;font-weight:600}
.complete-text{font-size:13px;color:#999;font-weight:600}
@media(max-width:400px){.wrap{padding:10px}h1{font-size:19px}.q-text{font-size:14px}}
</style>
</head>
<body>
<div class="wrap">
<div class="badge">● 정보처리기사 실기</div>
<h1>이론 기출 퀴즈</h1>
<div class="subtitle">2020~2025년 실제 기출 이론문제 · 키워드 입력형</div>

<div class="score-panel">
<div class="score-item"><div class="score-num green" id="sCorrect">0</div><div class="score-label">정답</div></div>
<div class="score-item"><div class="score-num red" id="sWrong">0</div><div class="score-label">오답</div></div>
<div class="score-item"><div class="score-num gray" id="sSkip">0</div><div class="score-label">건너뜀</div></div>
</div>

<div class="progress-row">
<span id="progText">1 / 0</span>
<span id="progPct">0%</span>
</div>
<div class="progress-bar"><div class="progress-fill" id="progBar" style="width:0%"></div></div>

<div class="tab-row">
<button class="tab-btn active" onclick="setMode('seq')">순서대로</button>
<button class="tab-btn" onclick="setMode('random')">랜덤</button>
<button class="tab-btn" onclick="setMode('wrong')">틀린문제만</button>
</div>

<div class="q-card" id="qCard">
<div class="q-header">
<span class="q-id" id="qId">Q001</span>
<span class="q-source" id="qSource">2020년 1회 1번</span>
</div>
<div class="q-status none" id="qStatus">미응답</div>
<div class="q-text" id="qText"></div>
<button class="hint-btn" id="hintBtn" onclick="showHint()">💡 힌트 보기</button>
<div class="hint-box" id="hintBox"></div>
<div class="input-row">
<input type="text" class="answer-input" id="ansInput" placeholder="답을 입력하세요..." autocomplete="off">
<button class="submit-btn" id="submitBtn" onclick="checkAnswer()">확인</button>
</div>
<div class="result-box" id="resultBox"></div>
</div>

<div class="nav-row">
<button class="nav-btn" onclick="goPrev()">‹ 이전</button>
<button class="nav-btn skip-btn" onclick="skipQ()">건너뛰기</button>
<button class="nav-btn" onclick="goNext()">다음 ›</button>
</div>

<div class="shortcut-bar">
<span><kbd>Enter</kbd> 정답 확인</span>
<span><kbd>←</kbd> <kbd>→</kbd> 이전 / 다음</span>
<span><kbd>H</kbd> 힌트</span>
</div>

<div class="bottom-row">
<button class="reset-btn" onclick="resetAll()">↻ 처음부터</button>
<span class="complete-text" id="completeText">0/0 응답 완료</span>
</div>
</div>

<script>
const Q=[
// ===== 2020년 1회 =====
{y:"2020",r:1,n:1,q:"동일한 테스트 케이스에 의한 반복적 테스트는 새로운 버그를 찾지 못한다는 테스트 원리를 무엇이라 하는가?",a:["살충제 패러독스","살충제패러독스","Pesticide Paradox"],h:"살충○ ○○○○"},
{y:"2020",r:1,n:2,q:"대규모로 저장된 데이터 안에서 체계적이고 자동적으로 통계적 규칙이나 패턴을 찾아내는 기술은?",a:["데이터 마이닝","데이터마이닝","Data Mining"],h:"데이터 ○○○"},
{y:"2020",r:1,n:3,q:"프로토콜의 기본 요소 3가지를 쓰시오.",a:["구문, 의미, 순서","구문, 의미, 타이밍","구문 의미 순서","구문 의미 타이밍","Syntax, Semantics, Timing"],h:"구○, 의○, 순○(타○○)"},
{y:"2020",r:1,n:4,q:"W3C에서 개발된 다목적 마크업 언어로, 사용자가 임의로 태그를 정의할 수 있는 언어는?",a:["XML","xml"],h:"○ML"},
{y:"2020",r:1,n:5,q:"속성-값 쌍(Attribute-Value Pair)으로 이루어진 데이터 오브젝트를 전달하기 위한 개방형 표준 포맷으로, AJAX에서 많이 사용되는 것은?",a:["JSON","json"],h:"○SON"},
{y:"2020",r:1,n:7,q:"HRN(Highest Response Ratio Next) 스케줄링의 우선순위 계산식을 쓰시오.",a:["(대기시간+서비스시간)/서비스시간","(대기 시간 + 서비스 시간) / 서비스 시간"],h:"(대기시간+○○○시간)/○○○시간"},
{y:"2020",r:1,n:8,q:"트랜잭션의 특성 중, 일관성과 지속성 외 나머지 2가지 특성을 쓰시오.",a:["원자성, 독립성","원자성, 격리성","원자성 독립성","원자성 격리성","Atomicity, Isolation"],h:"원○성, 독○성(격○성)"},
{y:"2020",r:1,n:9,q:"패킷의 출발지 주소와 목적지 주소를 동일하게 만들어 보내, 수신자가 자기 자신에게 응답을 보내게 하여 시스템을 마비시키는 공격은?",a:["랜드 어택","랜드어택","Land Attack","LAND Attack","LAND"],h:"○○드 어택"},

// ===== 2020년 2회 =====
{y:"2020",r:2,n:1,q:"비상사태 또는 업무중단 시점부터 업무가 복구되어 다시 정상 가동될 때까지의 시간을 의미하는 용어는?",a:["RTO","rto","Recovery Time Objective"],h:"R○O"},
{y:"2020",r:2,n:3,q:"전체 페이지를 새로 고치지 않고 페이지의 일부분만을 위한 데이터를 로드하는 비동기 통신 기법은?",a:["AJAX","ajax","Ajax"],h:"A○AX"},
{y:"2020",r:2,n:4,q:"절차보다 사람이 중심이 되어 변화에 유연하고 신속하게 적응하는 개발 방법론으로, 워터폴에 대비되는 방법론은?",a:["애자일","애자일 방법론","Agile"],h:"애○일"},
{y:"2020",r:2,n:7,q:"트랜잭션의 실행이 비정상적으로 종료되었을 때, 변경된 내용을 취소하고 이전 상태로 되돌리는 연산은?",a:["ROLLBACK","Rollback","롤백"],h:"R○LLBACK"},

// ===== 2020년 3회 =====
{y:"2020",r:3,n:1,q:"복잡한 코드를 단순화하고, 소스의 가독성을 높여 유지보수성을 향상시키는 활동의 목적을 가진 것은?",a:["리팩토링","Refactoring"],h:"리○○링"},
{y:"2020",r:3,n:3,q:"다익스트라 알고리즘을 이용한 대규모 네트워크에 적합한 링크 상태 라우팅 프로토콜은?",a:["OSPF","ospf","Open Shortest Path First"],h:"O○PF"},
{y:"2020",r:3,n:4,q:"형상 항목의 버전 관리를 위해서 변경 여부와 변경 활동을 통제하는 형상관리 활동은?",a:["형상 통제","형상통제"],h:"형상 ○○"},
{y:"2020",r:3,n:5,q:"심리학자 톰 마릴이 '기술적 은어'를 뜻하는 용어로 정의한, 서로 다른 시스템 간 데이터 교환을 위한 통신규약은?",a:["프로토콜","Protocol"],h:"프○토콜"},
{y:"2020",r:3,n:6,q:"TCP/IP에서 IP 패킷 처리 시 발생하는 오류를 알려주는 프로토콜은?",a:["ICMP","icmp","Internet Control Message Protocol"],h:"I○MP"},

// ===== 2020년 4회 (from 족보) =====
{y:"2020",r:4,n:1,q:"시스템의 데이터를 암호화하여 사용할 수 없도록 만든 후, 이를 인질로 금전을 요구하는 악성 소프트웨어는?",a:["랜섬웨어","Ransomware"],h:"랜○웨어"},
{y:"2020",r:4,n:4,q:"비선점 스케줄링 기법 중 대기 중인 프로세스의 실행 시간이 가장 짧은 것을 먼저 실행하는 알고리즘은?",a:["SJF","sjf","Shortest Job First"],h:"S○F"},
{y:"2020",r:4,n:9,q:"트랜잭션의 4가지 특성(ACID)에서 A, C, I, D 각각의 의미를 쓰시오.",a:["원자성, 일관성, 독립성, 영속성","원자성, 일관성, 격리성, 지속성","원자성 일관성 독립성 영속성","Atomicity, Consistency, Isolation, Durability"],h:"원○성, 일○성, 독○성, 영○성"},
{y:"2020",r:4,n:12,q:"연결형 서비스로 신뢰성을 보장하는 전송 계층 프로토콜은 TCP이고, 비연결형으로 빠른 전송이 특징인 프로토콜은?",a:["UDP","udp","User Datagram Protocol"],h:"U○P"},

// ===== 2021년 1회 =====
{y:"2021",r:1,n:1,q:"럼바우(Rumbaugh)의 객체지향 분석에서 사용하는 3가지 모델링을 쓰시오.",a:["객체 모델링, 동적 모델링, 기능 모델링","객체, 동적, 기능","객체 동적 기능"],h:"객○, 동○, 기○ 모델링"},
{y:"2021",r:1,n:2,q:"조합 가능한 모든 문자열을 하나씩 대입하여 암호를 해독하는 공격 방법은?",a:["브루트 포스","브루트포스","Brute Force","무차별 대입"],h:"브루트 ○○"},
{y:"2021",r:1,n:4,q:"관계대수의 순수 관계 연산자 4가지를 쓰시오.",a:["Select, Project, Join, Division","셀렉트, 프로젝트, 조인, 디비전","σ, π, ⋈, ÷"],h:"Select, Project, ○○○, Division"},
{y:"2021",r:1,n:7,q:"OSI 7계층에서 종단 간(End-to-End) 신뢰성 있는 데이터 전송을 담당하는 계층은?",a:["전송 계층","전송계층","Transport Layer","4계층"],h:"○○ 계층 (4계층)"},
{y:"2021",r:1,n:9,q:"상위 클래스에서 객체 생성 인터페이스를 정의하고, 서브클래스에서 어떤 클래스의 인스턴스를 생성할지 결정하는 디자인 패턴은?",a:["팩토리 메서드","팩토리메서드","Factory Method"],h:"○○토리 메서드"},
{y:"2021",r:1,n:12,q:"프로그램 내부 구조를 기반으로 테스트 케이스를 설계하는 것은 (  )박스 테스트, 외부 명세 기반은 (  )박스 테스트이다.",a:["화이트, 블랙","화이트박스, 블랙박스","White, Black"],h:"○이트, ○랙"},
{y:"2021",r:1,n:16,q:"리눅스에서 파일 소유자를 변경하는 명령어는?",a:["chown","CHOWN"],h:"ch○○n"},
{y:"2021",r:1,n:19,q:"192.168.10.0/24 네트워크를 4개의 서브넷으로 분할할 때 서브넷 마스크는?",a:["255.255.255.192","/26"],h:"255.255.255.○○○"},

// ===== 2021년 2회 =====
{y:"2021",r:2,n:1,q:"특정 조직을 대상으로 장기간에 걸쳐 지속적으로 해킹 공격을 시도하는 지능형 지속 위협은?",a:["APT","apt","Advanced Persistent Threat"],h:"A○T"},
{y:"2021",r:2,n:2,q:"모듈 내부의 응집도를 약한 순서에서 강한 순서로 나열하시오.",a:["우연적, 논리적, 시간적, 절차적, 통신적, 순차적, 기능적","우논시절통순기"],h:"우○시절통순기"},
{y:"2021",r:2,n:4,q:"제2정규형(2NF)에서 제3정규형(3NF)으로 변환할 때 제거해야 하는 종속성은?",a:["이행적 함수 종속","이행적함수종속","이행 종속","Transitive Dependency"],h:"이○적 함수 종속"},

let cur=0, mode='seq', order=[], answers={}, states={};
// states: 'correct','wrong','skip'

function init(){
  order=Q.map((_,i)=>i);
  render();
}

function setMode(m){
  mode=m;
  document.querySelectorAll('.tab-btn').forEach((b,i)=>{
    b.classList.toggle('active',['seq','random','wrong'][i]===m);
  });
  if(m==='seq') order=Q.map((_,i)=>i);
  else if(m==='random'){order=Q.map((_,i)=>i);for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]];}}
  else if(m==='wrong'){order=Q.map((_,i)=>i).filter(i=>states[i]==='wrong');}
  cur=0;
  render();
}

function render(){
  if(order.length===0){
    document.getElementById('qText').textContent=mode==='wrong'?'틀린 문제가 없습니다!':'문제가 없습니다.';
    document.getElementById('qId').textContent='—';
    document.getElementById('qSource').textContent='';
    document.getElementById('qStatus').textContent='';
    document.getElementById('qStatus').className='q-status none';
    document.getElementById('hintBox').className='hint-box';
    document.getElementById('resultBox').className='result-box';
    document.getElementById('ansInput').value='';
    return;
  }
  if(cur>=order.length) cur=order.length-1;
  if(cur<0) cur=0;
  const idx=order[cur];
  const q=Q[idx];
  document.getElementById('qId').textContent=`Q${String(cur+1).padStart(3,'0')}`;
  document.getElementById('qSource').textContent=`${q.y}년 ${q.r}회 ${q.n}번`;
  document.getElementById('qText').innerHTML=q.q;

  const st=states[idx];
  const statusEl=document.getElementById('qStatus');
  if(!st){statusEl.textContent='미응답';statusEl.className='q-status none';}
  else if(st==='correct'){statusEl.textContent='정답';statusEl.className='q-status correct';}
  else if(st==='wrong'){statusEl.textContent='오답';statusEl.className='q-status wrong';}
  else if(st==='skip'){statusEl.textContent='건너뜀';statusEl.className='q-status skip';}

  document.getElementById('hintBox').className='hint-box';
  document.getElementById('hintBox').textContent='💡 힌트: '+q.h;

  const inp=document.getElementById('ansInput');
  inp.value=answers[idx]||'';
  inp.className='answer-input';
  inp.disabled=!!st;
  document.getElementById('submitBtn').disabled=!!st;

  // Show result if answered
  const rb=document.getElementById('resultBox');
  if(st==='correct'){
    rb.className='result-box show correct';
    rb.innerHTML='✅ 정답입니다!<div class="result-answer">'+q.a[0]+'</div>';
    inp.className='answer-input correct-border';
  }else if(st==='wrong'){
    rb.className='result-box show wrong';
    rb.innerHTML='❌ 오답입니다.<div class="result-answer">정답: '+q.a[0]+'</div>';
    inp.className='answer-input wrong-border';
  }else if(st==='skip'){
    rb.className='result-box show wrong';
    rb.innerHTML='⏭ 건너뜀<div class="result-answer">정답: '+q.a[0]+'</div>';
  }else{
    rb.className='result-box';
    rb.innerHTML='';
  }

  // Progress
  const total=order.length;
  const answered=order.filter(i=>states[i]).length;
  document.getElementById('progText').textContent=`${cur+1} / ${total}`;
  document.getElementById('progPct').textContent=total>0?Math.round((cur+1)/total*100*10)/10+'%':'0%';
  document.getElementById('progBar').style.width=total>0?((cur+1)/total*100)+'%':'0%';

  // Scores
  const correct=Object.values(states).filter(v=>v==='correct').length;
  const wrong=Object.values(states).filter(v=>v==='wrong').length;
  const skip=Object.values(states).filter(v=>v==='skip').length;
  document.getElementById('sCorrect').textContent=correct;
  document.getElementById('sWrong').textContent=wrong;
  document.getElementById('sSkip').textContent=skip;
  document.getElementById('completeText').textContent=`${answered}/${total} 응답 완료`;

  if(!st) setTimeout(()=>inp.focus(),50);
}

function showHint(){
  document.getElementById('hintBox').classList.toggle('show');
}

function normalize(s){
  return s.replace(/[\s,./·()（）]/g,'').toLowerCase().trim();
}

function checkAnswer(){
  const idx=order[cur];
  if(states[idx]) return;
  const q=Q[idx];
  const val=document.getElementById('ansInput').value.trim();
  if(!val) return;
  answers[idx]=val;
  const nv=normalize(val);
  const isCorrect=q.a.some(a=>normalize(a)===nv);
  states[idx]=isCorrect?'correct':'wrong';
  render();
}

function skipQ(){
  const idx=order[cur];
  if(states[idx]) {goNext();return;}
  states[idx]='skip';
  render();
}

function goPrev(){if(cur>0){cur--;render();}}
function goNext(){if(cur<order.length-1){cur++;render();}}

function resetAll(){
  states={};answers={};cur=0;
  setMode('seq');
}

// Keyboard shortcuts
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();checkAnswer();}
  else if(e.key==='ArrowLeft'){e.preventDefault();goPrev();}
  else if(e.key==='ArrowRight'){e.preventDefault();goNext();}
  else if(e.key==='h'||e.key==='H'){
    if(document.activeElement!==document.getElementById('ansInput')){e.preventDefault();showHint();}
  }
});

init();
</script>


<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>정보처리기사 실기 기출퀴즈</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #ffffff;
  --surface: #f8f9fb;
  --surface2: #f1f3f7;
  --surface3: #e9edf5;
  --border: rgba(0,0,0,0.07);
  --border2: rgba(0,0,0,0.12);
  --text: #1a1d26;
  --text2: #5c6375;
  --text3: #9aa0b3;
  --accent: #4f8ef7;
  --accent2: #7b5cf0;
  --green: #10b981;
  --red: #ef4444;
  --yellow: #f59e0b;
  --radius: 12px;
  --radius-sm: 8px;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Noto Sans KR', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
}
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(ellipse 60% 40% at 20% 10%, rgba(79,142,247,0.08) 0%, transparent 60%),
    radial-gradient(ellipse 50% 30% at 80% 80%, rgba(123,92,240,0.07) 0%, transparent 60%);
  pointer-events: none;
  z-index: 0;
}
.grid-pattern {
  position: fixed;
  inset: 0;
  background-image:
    linear-gradient(rgba(0,0,0,0.02) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,0,0,0.02) 1px, transparent 1px);
  background-size: 40px 40px;
  pointer-events: none;
  z-index: 0;
}
.wrap {
  position: relative;
  z-index: 1;
  max-width: 760px;
  margin: 0 auto;
  padding: 2rem 1.5rem 4rem;
}

/* Header */
.app-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  margin-bottom: 2rem;
  padding-bottom: 1.5rem;
  border-bottom: 1px solid var(--border);
}
.logo-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: linear-gradient(135deg, rgba(79,142,247,0.15), rgba(123,92,240,0.15));
  border: 1px solid rgba(79,142,247,0.25);
  border-radius: 20px;
  padding: 3px 10px 3px 6px;
  font-size: 11px;
  font-family: 'JetBrains Mono', monospace;
  color: var(--accent);
  margin-bottom: 6px;
}
.logo-badge::before {
  content: '';
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--accent);
  animation: blink 2s infinite;
}
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }
.logo h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.5px; }
.logo p { font-size: 13px; color: var(--text2); font-weight: 300; margin-top: 2px; }

/* Stats row */
.stats-row {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin-bottom: 1.5rem;
}
.stat-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 12px 14px;
  text-align: center;
}
.stat-num {
  font-size: 24px; font-weight: 700;
  font-family: 'JetBrains Mono', monospace;
  line-height: 1; margin-bottom: 4px;
}
.stat-card:nth-child(1) .stat-num { color: var(--green); }
.stat-card:nth-child(2) .stat-num { color: var(--red); }
.stat-card:nth-child(3) .stat-num { color: var(--yellow); }
.stat-label { font-size: 11px; color: var(--text3); letter-spacing: 0.5px; }

/* Progress */
.progress-wrap { margin-bottom: 1.5rem; }
.progress-info {
  display: flex; justify-content: space-between;
  align-items: center; margin-bottom: 8px;
}
.progress-label { font-size: 12px; color: var(--text2); font-family: 'JetBrains Mono', monospace; }
.progress-pct { font-size: 12px; color: var(--text3); font-family: 'JetBrains Mono', monospace; }
.progress-track { height: 4px; background: var(--surface2); border-radius: 2px; overflow: hidden; }
.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--accent), var(--accent2));
  border-radius: 2px; transition: width 0.4s cubic-bezier(0.4,0,0.2,1);
}

/* Mode tabs */
.mode-tabs {
  display: flex; gap: 6px; margin-bottom: 1.5rem;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius-sm); padding: 4px;
}
.mode-tab {
  flex: 1; padding: 8px 12px; border: none; border-radius: 6px;
  background: transparent; color: var(--text3); font-size: 13px;
  font-family: 'Noto Sans KR', sans-serif; cursor: pointer; transition: all 0.2s;
}
.mode-tab:hover { color: var(--text2); background: var(--surface3); }
.mode-tab.active {
  background: var(--surface3); color: var(--text); font-weight: 500;
  box-shadow: inset 0 0 0 1px var(--border2);
}

/* Question card */
.q-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.75rem;
  margin-bottom: 1rem;
  position: relative; overflow: hidden;
  transition: border-color 0.3s;
  animation: slideIn 0.25s ease-out;
}
@keyframes slideIn { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
@keyframes shake { 0%,100%{transform:translateX(0)} 20%,60%{transform:translateX(-6px)} 40%,80%{transform:translateX(6px)} }
.q-card::before {
  content: '';
  position: absolute; top: 0; left: 0; right: 0; height: 2px;
  background: linear-gradient(90deg, var(--accent), var(--accent2));
  opacity: 0; transition: opacity 0.3s;
}
.q-card.answered::before { opacity: 1; }
.q-card.correct-state { border-color: rgba(16,185,129,0.35); }
.q-card.wrong-state { border-color: rgba(239,68,68,0.3); }
.q-card.shake { animation: shake 0.35s ease-out; }

.q-meta {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 1rem; flex-wrap: wrap; gap: 6px;
}
.q-meta-left { display: flex; align-items: center; gap: 6px; }
.q-number {
  font-size: 11px; font-family: 'JetBrains Mono', monospace;
  color: var(--text3); background: var(--surface2);
  border: 1px solid var(--border); border-radius: 20px; padding: 3px 10px;
}
.q-source {
  font-size: 11px; color: var(--text3);
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: 20px; padding: 3px 10px;
  font-family: 'JetBrains Mono', monospace;
}
.q-cat-badge {
  font-size: 11px; font-weight: 500; padding: 3px 10px;
  border-radius: 20px; color: #fff;
}
.q-status-tag { font-size: 12px; font-weight: 600; }

.q-text {
  font-size: 15px; line-height: 1.75; color: var(--text);
  margin-bottom: 1.25rem; font-weight: 400;
}

/* Hint */
.hint-toggle {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 12px; color: var(--text3); background: none;
  border: 1px solid var(--border); border-radius: 20px;
  padding: 4px 12px; cursor: pointer; margin-bottom: 1rem;
  font-family: 'Noto Sans KR', sans-serif; transition: all 0.2s;
}
.hint-toggle:hover { color: var(--accent); border-color: rgba(79,142,247,0.3); }
.hint-box {
  display: none;
  background: rgba(79,142,247,0.06);
  border: 1px solid rgba(79,142,247,0.15);
  border-radius: var(--radius-sm);
  padding: 10px 14px; font-size: 13px;
  color: var(--accent); margin-bottom: 1rem; font-style: italic;
}

/* Input */
.input-area { display: flex; gap: 8px; margin-bottom: 12px; }
.ans-input {
  flex: 1; padding: 11px 14px;
  background: var(--surface2); border: 1px solid var(--border2);
  border-radius: var(--radius-sm); color: var(--text);
  font-size: 14px; font-family: 'Noto Sans KR', sans-serif;
  outline: none; transition: all 0.2s;
}
.ans-input::placeholder { color: var(--text3); }
.ans-input:focus {
  border-color: var(--accent); background: var(--surface3);
  box-shadow: 0 0 0 3px rgba(79,142,247,0.1);
}
.ans-input:disabled { opacity: 0.6; cursor: not-allowed; }
.check-btn {
  padding: 11px 20px;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  border: none; border-radius: var(--radius-sm); color: #fff;
  font-size: 13px; font-weight: 500;
  font-family: 'Noto Sans KR', sans-serif;
  cursor: pointer; transition: all 0.2s; white-space: nowrap;
}
.check-btn:hover { opacity: 0.85; transform: translateY(-1px); }
.check-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

/* Result */
.result-area {
  display: none; border-radius: var(--radius-sm); overflow: hidden;
}
.result-header {
  display: flex; align-items: center; gap: 8px;
  padding: 10px 14px; font-size: 14px; font-weight: 500;
}
.result-area.correct .result-header {
  background: rgba(16,185,129,0.1); color: var(--green);
  border: 1px solid rgba(16,185,129,0.2);
}
.result-area.wrong .result-header {
  background: rgba(239,68,68,0.07); color: var(--red);
  border: 1px solid rgba(239,68,68,0.15);
}
.result-answer {
  display: none; padding: 12px 14px;
  background: var(--surface2); border: 1px solid var(--border); border-top: none;
  border-radius: 0 0 var(--radius-sm) var(--radius-sm);
}
.result-answer-label {
  font-size: 11px; color: var(--text3); margin-bottom: 6px;
  font-family: 'JetBrains Mono', monospace; letter-spacing: 1px; text-transform: uppercase;
}
.result-answer-text { font-size: 14px; color: var(--text); line-height: 1.75; }

/* Nav */
.nav-area {
  display: grid; grid-template-columns: 1fr auto 1fr;
  gap: 8px; align-items: center;
}
.nav-btn {
  padding: 11px 16px; background: var(--surface);
  border: 1px solid var(--border2); border-radius: var(--radius-sm);
  color: var(--text2); font-size: 13px;
  font-family: 'Noto Sans KR', sans-serif; cursor: pointer;
  transition: all 0.2s; display: flex; align-items: center; gap: 6px;
}
.nav-btn:hover { background: var(--surface2); color: var(--text); }
.nav-btn.prev { justify-content: flex-start; }
.nav-btn.next { justify-content: flex-end; }
.skip-btn {
  padding: 8px 14px; background: none;
  border: 1px solid var(--border); border-radius: var(--radius-sm);
  color: var(--text3); font-size: 12px;
  font-family: 'Noto Sans KR', sans-serif; cursor: pointer;
  transition: all 0.2s; white-space: nowrap;
}
.skip-btn:hover { color: var(--text2); border-color: var(--border2); }

/* Footer */
.footer-tools {
  display: flex; justify-content: space-between; align-items: center;
  margin-top: 1.25rem; padding-top: 1rem; border-top: 1px solid var(--border);
}
.reset-btn {
  padding: 7px 14px; background: none; border: 1px solid var(--border);
  border-radius: var(--radius-sm); color: var(--text3); font-size: 12px;
  font-family: 'Noto Sans KR', sans-serif; cursor: pointer; transition: all 0.2s;
}
.reset-btn:hover { border-color: rgba(239,68,68,0.4); color: var(--red); }
.footer-info { font-size: 12px; color: var(--text3); font-family: 'JetBrains Mono', monospace; }

/* Keyboard hints */
.kbd-hints {
  display: flex; gap: 12px; margin-top: 0.75rem;
  padding: 8px 12px; background: var(--surface);
  border: 1px solid var(--border); border-radius: var(--radius-sm);
}
.kbd-hint { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--text3); }
kbd {
  background: var(--surface2); border: 1px solid var(--border2);
  border-radius: 4px; padding: 1px 5px;
  font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--text2);
}

@media (max-width: 540px) {
  .wrap { padding: 1.25rem 1rem 3rem; }
  .q-card { padding: 1.25rem; }
  .mode-tab { font-size: 12px; padding: 7px 8px; }
  .kbd-hints { display: none; }
  .q-text { font-size: 14px; }
}
</style>
</head>
<body>
<div class="grid-pattern"></div>
<div class="wrap">

  <header class="app-header">
    <div class="logo">
      <div class="logo-badge">정보처리기사 실기</div>
      <h1>이론 기출퀴즈</h1>
      <p>2020~2025년 19회차 기출 이론문제 — 주관식 입력형</p>
    </div>
  </header>

  <div class="stats-row">
    <div class="stat-card"><div class="stat-num" id="sc-correct">0</div><div class="stat-label">정답</div></div>
    <div class="stat-card"><div class="stat-num" id="sc-wrong">0</div><div class="stat-label">오답</div></div>
    <div class="stat-card"><div class="stat-num" id="sc-skip">0</div><div class="stat-label">건너뜀</div></div>
  </div>

  <div class="progress-wrap">
    <div class="progress-info">
      <span class="progress-label" id="prog-label">1 / 0</span>
      <span class="progress-pct" id="prog-pct">0%</span>
    </div>
    <div class="progress-track">
      <div class="progress-fill" id="prog-fill" style="width:0%"></div>
    </div>
  </div>

  <div class="mode-tabs">
    <button class="mode-tab active" onclick="setMode('seq',this)">순서대로</button>
    <button class="mode-tab" onclick="setMode('rand',this)">랜덤</button>
    <button class="mode-tab" onclick="setMode('wrong',this)">틀린문제만</button>
  </div>

  <div id="q-container"></div>

  <div class="nav-area">
    <button class="nav-btn prev" onclick="go(-1)">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15,18 9,12 15,6"/></svg>
      이전
    </button>
    <button class="skip-btn" onclick="skipQ()">건너뛰기</button>
    <button class="nav-btn next" onclick="go(1)">
      다음
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9,18 15,12 9,6"/></svg>
    </button>
  </div>

  <div class="kbd-hints">
    <div class="kbd-hint"><kbd>Enter</kbd> 정답 확인</div>
    <div class="kbd-hint"><kbd>←</kbd><kbd>→</kbd> 이전 / 다음</div>
    <div class="kbd-hint"><kbd>H</kbd> 힌트</div>
  </div>

  <div class="footer-tools">
    <button class="reset-btn" onclick="resetAll()">↺ 처음부터</button>
    <span class="footer-info" id="footer-info">문제를 풀어보세요</span>
  </div>
</div>

<script>
const CAT_COLOR = {
  "소프트웨어공학": "#6366f1",
  "보안":           "#ef4444",
  "네트워크":       "#0891b2",
  "데이터베이스":   "#ca8a04",
  "운영체제":       "#7c3aed",
  "신기술/용어":    "#059669"
};

const QS = [
  // ── 2020-1 ──
  {y:"2020",r:"1",n:"1",cat:"소프트웨어공학",q:"동일한 테스트 케이스로 반복 테스트하면 더 이상 새로운 결함을 발견할 수 없다는 테스트 원리를 무엇이라 하는가?",a:"살충제 패러독스 (Pesticide Paradox)",h:"반복 테스트의 한계"},
  {y:"2020",r:"1",n:"2",cat:"신기술/용어",q:"대규모로 저장된 데이터 안에서 체계적이고 자동적으로 통계적 규칙이나 패턴을 찾아내는 기술은?",a:"데이터 마이닝 (Data Mining)",h:"대량 데이터 패턴 발견"},
  {y:"2020",r:"1",n:"3",cat:"네트워크",q:"프로토콜의 기본 요소 3가지를 쓰시오.",a:"구문 (Syntax), 의미 (Semantics), 순서/타이밍 (Timing)",h:"구문/의미/시간"},
  {y:"2020",r:"1",n:"4",cat:"신기술/용어",q:"웹 브라우저 간 HTML 데이터를 주고받을 때 사전에 정해진 태그 외에도 사용자가 임의로 태그를 정의할 수 있는 마크업 언어는?",a:"XML (eXtensible Markup Language)",h:"확장 가능한 마크업 언어"},
  {y:"2020",r:"1",n:"5",cat:"신기술/용어",q:"속성-값 쌍(Attribute-Value Pair)으로 이루어진 데이터 오브젝트를 전달하기 위한 경량의 개방형 표준 데이터 포맷은?",a:"JSON (JavaScript Object Notation)",h:"키-값 쌍 텍스트 포맷"},
  {y:"2020",r:"1",n:"7",cat:"데이터베이스",q:"트랜잭션 실행 중 오류가 발생하여 변경된 내용을 취소하고 트랜잭션 시작 전 상태로 되돌리는 연산은?",a:"ROLLBACK",h:"작업 취소, 이전 상태 복귀"},
  {y:"2020",r:"1",n:"8",cat:"보안",q:"IP 계층(3계층)에서 무결성과 인증을 보장하는 인증헤더(AH)와 기밀성을 보장하는 암호화(ESP)를 이용하여 양 종단 간 보안 서비스를 제공하는 프로토콜은?",a:"IPSec (IP Security)",h:"IP 계층 보안"},
  {y:"2020",r:"1",n:"9",cat:"소프트웨어공학",q:"소스 코드를 실행하지 않고 코드의 구조, 데이터 흐름 등을 분석하여 결함을 찾는 테스트 도구 유형은?",a:"정적 분석 도구",h:"실행 없이 분석"},
  {y:"2020",r:"1",n:"10",cat:"소프트웨어공학",q:"한 객체의 상태가 바뀌면 그 객체에 의존하는 다른 객체들에게 통보(Notify)되고 자동으로 갱신되는 디자인 패턴은?",a:"Observer (옵서버) 패턴",h:"일대다 의존성, 상태 전파"},
  {y:"2020",r:"1",n:"11",cat:"운영체제",q:"리눅스 커널 기반의 개방형 모바일 운영체제로, 구글에서 공개한 것은?",a:"안드로이드 (Android)",h:"모바일, 자바/코틀린"},
  {y:"2020",r:"1",n:"13",cat:"신기술/용어",q:"HTTP, HTTPS, SMTP 등을 사용하여 XML 기반의 메시지를 교환하는 프로토콜은?",a:"SOAP (Simple Object Access Protocol)",h:"xml 기반 메시지 교환"},
  {y:"2020",r:"1",n:"14",cat:"보안",q:"웹 응용 프로그램에서 입력란에 악의적인 SQL 구문을 삽입하여 데이터베이스를 비정상적으로 조작하는 공격 기법은?",a:"SQL Injection",h:"SQL 구문 삽입 공격"},
  {y:"2020",r:"1",n:"15",cat:"운영체제",q:"리눅스에서 chmod 751 test.txt 실행 시 소유자, 그룹, 기타사용자의 권한을 각각 쓰시오.",a:"소유자: rwx / 그룹: r-x / 기타: --x",h:"rwx=7, r-x=5, --x=1"},
  {y:"2020",r:"1",n:"16",cat:"소프트웨어공학",q:"사용자 인터페이스(UI) 설계 원칙 중, 사용자의 목적을 정확하게 달성할 수 있어야 한다는 원칙은?",a:"유효성 (Effectiveness)",h:"목적 달성"},
  {y:"2020",r:"1",n:"19",cat:"소프트웨어공학",q:"기업 내 각종 애플리케이션 간 데이터를 연계·통합하는 EAI 유형 중, 중앙 집중형 방식으로 허브 시스템을 통해 데이터를 전송하는 방식은?",a:"Hub & Spoke",h:"허브 중앙집중"},

  {y:"2021",r:"2",n:"9",cat:"소프트웨어공학",q:"복잡한 객체를 단계별로 생성하여, 같은 생성 절차에서 서로 다른 표현 결과를 만들어내는 디자인 패턴은?",a:"Builder (빌더) 패턴",h:"단계별 객체 생성"},
  {y:"2021",r:"2",n:"10",cat:"네트워크",q:"TCP에서 연결을 설정할 때 사용하는 3단계 과정의 이름과 순서를 쓰시오.",a:"3-way Handshake\n① SYN → ② SYN+ACK → ③ ACK",h:"SYN / SYN+ACK / ACK"},

  {y:"2021",r:"2",n:"13",cat:"데이터베이스",q:"하나 이상의 기본 테이블로부터 유도된 가상 테이블로, 물리적으로 저장되지 않는 것은?",a:"뷰 (View)",h:"가상 테이블"},
  {y:"2021",r:"2",n:"15",cat:"소프트웨어공학",q:"소프트웨어 테스트의 4가지 레벨을 순서대로 쓰시오.",a:"단위 테스트 → 통합 테스트 → 시스템 테스트 → 인수 테스트",h:"단위/통합/시스템/인수"},
  {y:"2021",r:"2",n:"19",cat:"네트워크",q:"하나의 물리적 네트워크를 여러 개의 논리적 네트워크로 분할하여 브로드캐스트 도메인을 나누는 기술은?",a:"VLAN (Virtual LAN)",h:"논리적 네트워크 분할"},

  {y:"2021",r:"3",n:"2",cat:"소프트웨어공학",q:"소프트웨어 프로세스 성숙도를 5단계로 평가하는 모델은?",a:"CMMI (Capability Maturity Model Integration)\n초기→관리→정의→정량적관리→최적화",h:"5단계 성숙도 모델"},
  {y:"2021",r:"3",n:"4",cat:"데이터베이스",q:"데이터베이스의 무결성 제약조건 중, 기본키는 NULL이 될 수 없다는 제약은?",a:"개체 무결성 (Entity Integrity)",h:"기본키 NULL 불가"},
  {y:"2021",r:"3",n:"7",cat:"운영체제",q:"가장 오랫동안 참조되지 않은 페이지를 교체하는 알고리즘은?",a:"LRU (Least Recently Used)",h:"가장 오래된 페이지 교체"},
  {y:"2021",r:"3",n:"9",cat:"소프트웨어공학",q:"기존 클래스의 인터페이스를 클라이언트가 기대하는 다른 인터페이스로 변환하여 호환성을 제공하는 디자인 패턴은?",a:"Adapter (어댑터) 패턴",h:"인터페이스 변환/호환"},

  {y:"2021",r:"3",n:"12",cat:"데이터베이스",q:"ERD(개체관계도)의 기본 구성요소 3가지를 쓰시오.",a:"개체(Entity), 관계(Relationship), 속성(Attribute)",h:"개체/관계/속성"},
  {y:"2021",r:"3",n:"13",cat:"소프트웨어공학",q:"입력값의 경계 부근에서 오류가 발생할 확률이 높다는 점을 이용한 블랙박스 테스트 기법은?",a:"경계값 분석 (Boundary Value Analysis)",h:"경계 입력값 테스트"},
  {y:"2021",r:"3",n:"15",cat:"보안",q:"웹 페이지에 악성 스크립트를 삽입하여, 해당 페이지를 열람하는 다른 사용자의 정보를 탈취하는 공격은?",a:"XSS (Cross-Site Scripting)",h:"악성 스크립트 삽입"},
  {y:"2021",r:"3",n:"17",cat:"소프트웨어공학",q:"모듈 내부의 모든 기능이 단일 목적을 위해 수행되는 가장 강한 응집도는?",a:"기능적 응집도 (Functional Cohesion)",h:"가장 강한 응집도"},
  {y:"2021",r:"3",n:"19",cat:"네트워크",q:"사설 IP를 공인 IP로 변환하는 기술은?",a:"NAT (Network Address Translation)",h:"사설→공인 IP 변환"},
  {y:"2021",r:"3",n:"20",cat:"소프트웨어공학",q:"UML 행위 다이어그램 중 객체 간 메시지 교환을 시간 순서대로 표현한 것은?",a:"시퀀스(Sequence) 다이어그램",h:"시간 순서 메시지"},

  {y:"2022",r:"1",n:"1",cat:"보안",q:"원격 호스트에 안전하게 접속하기 위해 사용되는 프로토콜로, 포트 22번을 사용하는 것은?",a:"SSH (Secure Shell)",h:"포트 22, 암호화 접속"},
  {y:"2022",r:"1",n:"2",cat:"소프트웨어공학",q:"요구사항을 기능 요구사항과 비기능 요구사항으로 분류할 때, 성능·보안·품질은 어디에 해당하는가?",a:"비기능 요구사항 (Non-Functional Requirements)",h:"성능/보안/품질=비기능"},
  {y:"2022",r:"1",n:"4",cat:"데이터베이스",q:"트랜잭션의 격리 수준(Isolation Level) 4가지를 낮은 순서에서 높은 순서로 쓰시오.",a:"Read Uncommitted → Read Committed → Repeatable Read → Serializable",h:"격리 수준 낮→높"},

  {y:"2022",r:"1",n:"9",cat:"소프트웨어공학",q:"알고리즘을 캡슐화하여, 동일 계열의 알고리즘을 상호 교환 가능하게 하는 디자인 패턴은?",a:"Strategy (전략) 패턴",h:"알고리즘 캡슐화, 교환 가능"},

  {y:"2022",r:"1",n:"12",cat:"데이터베이스",q:"데이터베이스에서 데이터 검색 속도를 향상시키기 위한 자료구조는?",a:"인덱스 (Index)\n종류: B-트리, B+트리, 해시 인덱스 등",h:"검색 속도 향상"},
  {y:"2022",r:"1",n:"13",cat:"소프트웨어공학",q:"테스트 실행에 필요한 환경을 구성하는 요소들의 집합으로, 드라이버, 스텁 등을 포함하는 것은?",a:"테스트 하네스 (Test Harness)",h:"드라이버+스텁+테스트슈트"},

  {y:"2022",r:"1",n:"16",cat:"운영체제",q:"리눅스에서 파일 내용 중 특정 패턴을 검색하는 명령어는?",a:"grep\n사용법: grep [패턴] [파일명]",h:"패턴 검색"},

  {y:"2022",r:"1",n:"19",cat:"네트워크",q:"도메인 이름을 IP 주소로 변환해주는 시스템은?",a:"DNS (Domain Name System) - 포트: 53",h:"도메인→IP 변환"},

  {y:"2022",r:"2",n:"2",cat:"데이터베이스",q:"관계대수에서 조건에 맞는 행(튜플)을 선택하는 연산과, 원하는 열(속성)만 추출하는 연산을 각각 쓰시오.",a:"Selection (σ, 셀렉션) / Projection (π, 프로젝션)",h:"σ=행 선택, π=열 추출"},

  {y:"2022",r:"2",n:"7",cat:"운영체제",q:"FIFO, LRU, LFU 페이지 교체 알고리즘의 기준을 각각 쓰시오.",a:"FIFO: 가장 먼저 들어온 페이지 교체\nLRU: 가장 오래전에 사용된 페이지 교체\nLFU: 사용 빈도가 가장 낮은 페이지 교체",h:"FIFO/LRU/LFU"},

  {y:"2022",r:"2",n:"10",cat:"네트워크",q:"AS(자율시스템) 내부에서 사용하는 라우팅 프로토콜(IGP)과 외부에서 사용하는 프로토콜(EGP)을 각각 1가지씩 쓰시오.",a:"IGP: OSPF (또는 RIP)\nEGP: BGP",h:"안에는 OSPF, 밖에는 BGP"},
  {y:"2022",r:"2",n:"17",cat:"소프트웨어공학",q:"객체지향 설계 원칙 SOLID에서 S, O, L, I, D가 의미하는 원칙을 각각 쓰시오.",a:"S: 단일 책임(SRP)\nO: 개방-폐쇄(OCP)\nL: 리스코프 치환(LSP)\nI: 인터페이스 분리(ISP)\nD: 의존 역전(DIP)",h:"단개리인의"},
  {y:"2022",r:"2",n:"19",cat:"네트워크",q:"IP 주소를 MAC 주소로 변환하는 프로토콜은 ( )이고, MAC 주소를 IP 주소로 변환하는 프로토콜은 ( )이다.",a:"ARP (Address Resolution Protocol) / RARP (Reverse ARP)",h:"ARP=IP→MAC, RARP=MAC→IP"},

  {y:"2022",r:"3",n:"1",cat:"보안",q:"알려지지 않은 보안 취약점을 이용한 공격으로, 패치가 나오기 전에 수행되는 공격은?",a:"제로데이 공격 (Zero Day Attack)",h:"패치 전 취약점 공격"},
  {y:"2022",r:"3",n:"2",cat:"소프트웨어공학",q:"스크럼(Scrum)에서 2~4주의 반복 개발 주기를 무엇이라 하는가?",a:"스프린트 (Sprint)",h:"반복 개발 주기"},
  {y:"2022",r:"3",n:"4",cat:"데이터베이스",q:"릴레이션의 키 종류 중, 튜플을 유일하게 식별할 수 있는 속성의 부분집합으로 유일성과 최소성을 만족하는 키는?",a:"후보키 (Candidate Key)\n슈퍼키: 유일성만 / 기본키: 후보키 중 선정 / 대체키: 기본키 아닌 후보키",h:"유일성+최소성"},
  {y:"2022",r:"3",n:"7",cat:"운영체제",q:"프로세스의 메모리를 고정 크기로 분할하는 것은 페이징이고, 가변 크기로 분할하는 것은?",a:"세그먼테이션 (Segmentation)",h:"가변 크기 분할"},

  {y:"2022",r:"3",n:"13",cat:"소프트웨어공학",q:"통합 테스트에서 상위 모듈부터 하위 모듈로 진행하며, 하위 모듈을 스텁(Stub)으로 대체하는 방식은?",a:"하향식 (Top-Down) 통합 테스트\n(상향식: 드라이버 사용)",h:"하향식=스텁, 상향식=드라이버"},
  {y:"2022",r:"3",n:"16",cat:"운영체제",q:"리눅스에서 파일 권한 표시 'rwxr-x---'를 8진수로 표현하면?",a:"750",h:"rwx=7, r-x=5, ---=0"},
  {y:"2022",r:"3",n:"17",cat:"소프트웨어공학",q:"결합도(Coupling)의 종류를 약한 순서에서 강한 순서로 나열하시오.",a:"자료 → 스탬프 → 제어 → 외부 → 공통 → 내용\n암기: 자스제외공내",h:"자스제외공내"},
  {y:"2022",r:"3",n:"19",cat:"네트워크",q:"TCP/IP 4계층을 순서대로 쓰시오.",a:"네트워크 액세스(링크) → 인터넷 → 전송 → 응용",h:"링크/인터넷/전송/응용"},

let mode = 'seq';
let filteredOrder = [];
let cur = 0;
let results = {};
let wrongSet = new Set();
let correctCount = 0, wrongCount = 0, skipCount = 0;
let answered = false;

function buildOrder() {
  if (mode === 'seq') {
    filteredOrder = [...Array(QS.length).keys()];
  } else if (mode === 'rand') {
    filteredOrder = [...Array(QS.length).keys()];
    for (let i = filteredOrder.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [filteredOrder[i], filteredOrder[j]] = [filteredOrder[j], filteredOrder[i]];
    }
  } else {
    filteredOrder = wrongSet.size > 0 ? [...wrongSet] : [...Array(QS.length).keys()];
  }
}

function setMode(m, btn) {
  mode = m;
  document.querySelectorAll('.mode-tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  buildOrder(); cur = 0; render();
}

function currentIdx() { return filteredOrder[cur]; }

function render() {
  const idx = currentIdx();
  const q = QS[idx];
  answered = !!results[idx];

  const total = filteredOrder.length;
  const pct = ((cur + 1) / total * 100).toFixed(1);
  document.getElementById('prog-label').textContent = `${cur + 1} / ${total}`;
  document.getElementById('prog-pct').textContent = pct + '%';
  document.getElementById('prog-fill').style.width = pct + '%';
  document.getElementById('sc-correct').textContent = correctCount;
  document.getElementById('sc-wrong').textContent = wrongCount;
  document.getElementById('sc-skip').textContent = skipCount;

  const prevResult = results[idx];
  const color = CAT_COLOR[q.cat] || '#666';

  let cardClass = 'q-card';
  if (prevResult === 'correct') cardClass += ' answered correct-state';
  else if (prevResult === 'wrong') cardClass += ' answered wrong-state';

  const ansLines = q.a.split('\n').map(l => `<div>${l}</div>`).join('');
  const statusIcon = prevResult === 'correct' ? '✓ 정답' : prevResult === 'wrong' ? '✗ 오답' : '미응답';
  const statusColor = prevResult === 'correct' ? 'var(--green)' : prevResult === 'wrong' ? 'var(--red)' : 'var(--text3)';

  document.getElementById('q-container').innerHTML = `
    <div class="${cardClass}" id="q-card">
      <div class="q-meta">
        <div class="q-meta-left">
          <span class="q-number">Q${String(idx + 1).padStart(3,'0')}</span>
          <span class="q-source">${q.y}년 ${q.r}회차 ${q.n}번</span>
          <span class="q-cat-badge" style="background:${color}">${q.cat}</span>
        </div>
        <span class="q-status-tag" style="color:${statusColor}">${statusIcon}</span>
      </div>
      <div class="q-text">${q.q}</div>
      <button class="hint-toggle" onclick="toggleHint(this)" id="hint-btn">
        <span>💡</span> 힌트 보기
      </button>
      <div class="hint-box" id="hint-box">${q.h}</div>
      <div class="input-area">
        <input class="ans-input" id="ans-inp" type="text"
          placeholder="답을 입력하세요..."
          ${answered ? 'disabled' : ''}
          onkeydown="if(event.key==='Enter')checkAns()">
        <button class="check-btn" onclick="checkAns()" ${answered ? 'disabled' : ''}>확인</button>
      </div>
      <div class="result-area ${prevResult || ''}" id="result-area" style="display:${prevResult ? 'block' : 'none'}">
        <div class="result-header">
          ${prevResult === 'correct' ? '✓ 정답입니다!' : prevResult === 'wrong' ? '✗ 틀렸습니다.' : ''}
        </div>
        <div class="result-answer" style="display:${prevResult ? 'block' : 'none'}">
          <div class="result-answer-label">정답</div>
          <div class="result-answer-text">${ansLines}</div>
        </div>
      </div>
    </div>
  `;

  updateFooter();
  if (!answered) setTimeout(() => { const inp = document.getElementById('ans-inp'); if (inp) inp.focus(); }, 80);
}

function toggleHint(btn) {
  const box = document.getElementById('hint-box');
  const show = box.style.display === 'block';
  box.style.display = show ? 'none' : 'block';
  btn.innerHTML = `<span>💡</span> ${show ? '힌트 보기' : '힌트 숨기기'}`;
}

function normalize(s) {
  return s.replace(/[\s\(\)\[\]①②③④⑤\-\/]/g, '').toLowerCase();
}

function checkAns() {
  if (answered) return;
  const idx = currentIdx();
  const q = QS[idx];
  const inp = document.getElementById('ans-inp');
  const val = inp.value.trim();
  if (!val) { inp.focus(); return; }

  const nVal = normalize(val);
  const nAns = normalize(q.a);
  // 첫 번째 키워드와도 비교
  const firstKw = normalize(q.a.split('\n')[0]);
  const correct = nVal === nAns || nAns.includes(nVal) || firstKw.includes(nVal) ||
    (nVal.length >= 3 && nAns.includes(nVal));

  answered = true;
  inp.disabled = true;
  document.querySelector('.check-btn').disabled = true;

  if (correct) {
    results[idx] = 'correct'; wrongSet.delete(idx); correctCount++;
  } else {
    results[idx] = 'wrong'; wrongSet.add(idx); wrongCount++;
  }

  const card = document.getElementById('q-card');
  if (!correct) {
    card.classList.add('shake');
    setTimeout(() => card.classList.remove('shake'), 400);
  }
  card.classList.add('answered', correct ? 'correct-state' : 'wrong-state');

  const ra = document.getElementById('result-area');
  ra.className = 'result-area ' + (correct ? 'correct' : 'wrong');
  ra.style.display = 'block';
  ra.querySelector('.result-header').textContent = correct ? '✓ 정답입니다!' : '✗ 틀렸습니다.';
  ra.querySelector('.result-answer').style.display = 'block';

  const statusTag = card.querySelector('.q-status-tag');
  statusTag.style.color = correct ? 'var(--green)' : 'var(--red)';
  statusTag.textContent = correct ? '✓ 정답' : '✗ 오답';

  updateFooter();
}

function updateFooter() {
  const done = Object.keys(results).length;
  document.getElementById('footer-info').textContent = `${done}/${filteredOrder.length} 응답 완료`;
  document.getElementById('sc-correct').textContent = correctCount;
  document.getElementById('sc-wrong').textContent = wrongCount;
  document.getElementById('sc-skip').textContent = skipCount;
}

function go(dir) {
  cur += dir;
  if (cur < 0) cur = filteredOrder.length - 1;
  if (cur >= filteredOrder.length) cur = 0;
  render();
}

function skipQ() { skipCount++; go(1); }

function resetAll() {
  results = {}; wrongSet = new Set();
  correctCount = 0; wrongCount = 0; skipCount = 0;
  cur = 0; buildOrder(); render();
}

document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.key === 'ArrowRight') go(1);
  else if (e.key === 'ArrowLeft') go(-1);
  else if (e.key === 'h' || e.key === 'H') {
    const btn = document.getElementById('hint-btn');
    if (btn) btn.click();
  }
});

buildOrder();
render();
</script>
</body>
</html>
